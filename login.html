<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | AutoMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/ux.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Auto<em>Market</em></a>
      <nav class="nav" id="nav"></nav>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="main">
    <div class="page-bar"><div class="container"><h1>Log in</h1><p>Use the email you signed up with on this browser.</p></div></div>
    <div class="container page-wrap" style="max-width:440px">
      <div class="card-panel">
        <p class="alert alert-warn">Demo account — local browser only. Not production authentication.</p>
        <form id="loginForm">
          <div class="filter-group"><label for="email">Email</label><input class="form-control" id="email" type="email" required></div>
          <div class="filter-group"><label for="password">Password</label><input class="form-control" id="password" type="password" required></div>
          <button class="btn-search" type="submit" style="width:100%;justify-content:center">Log in</button>
        </form>
        <p id="loginErr" class="alert alert-warn" hidden style="margin-top:12px"></p>
        <p style="margin-top:14px">No account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="container"><div class="footer-bottom">© 2026 AutoMarket</div></div></footer>
  <script src="js/vehicles.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const user = getUsers().find(u => u.email === email && u.password === password);
      const err = document.getElementById("loginErr");
      if (!user) {
        err.hidden = false;
        err.textContent = "Email or password does not match an account on this browser.";
        return;
      }
      setSession(user);
      location.href = "index.html";
    });
  </script>
</body>
</html>
