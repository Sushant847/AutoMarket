<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locations | AutoMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/ux.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Auto<em>Market</em></a>
      <nav class="nav" id="nav"></nav>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="main">
    <div class="page-bar"><div class="container"><h1>Locations</h1><p>Where listings in this sample are based, with median asking price.</p></div></div>
    <div class="container page-wrap"><div class="car-grid" id="grid"></div></div>
  </main>
  <footer class="footer"><div class="container"><div class="footer-bottom">© 2026 AutoMarket · ICT807</div></div></footer>
  <script src="js/vehicles.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const places = getUnique('location');
      grid.innerHTML = places.map(loc => {
        const rows = vehicleData.filter(v => v.location === loc);
        const prices = rows.map(v => v.price).filter(Boolean);
        return `<article class="car-card"><div class="car-card-body">
          <h3 class="car-card-title">${escapeHtml(loc)}</h3>
          <p class="car-card-price">${formatPrice(median(prices))}</p>
          <p class="car-card-sub">${rows.length} listings</p>
        </div></article>`;
      }).join('');
    });
  </script>
</body>
</html>
