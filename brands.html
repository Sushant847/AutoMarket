<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brands | AutoMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/ux.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Auto<em>Market</em></a>
      <nav class="nav" id="nav"></nav>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="main">
    <div class="page-bar"><div class="container"><h1>Brands</h1><p>Median asking price and listing count by brand in this sample.</p></div></div>
    <div class="container page-wrap"><div class="car-grid" id="grid"></div></div>
  </main>
  <footer class="footer"><div class="container"><div class="footer-bottom">© 2026 AutoMarket · ICT807</div></div></footer>
  <script src="js/vehicles.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const brands = getUnique('brand');
      grid.innerHTML = brands.map(b => {
        const rows = vehicleData.filter(v => v.brand === b);
        const prices = rows.map(v => v.price).filter(Boolean);
        return `<a class="car-card" href="browse.html?brand=${encodeURIComponent(b)}">
          <div class="car-card-body">
            <h3 class="car-card-title">${escapeHtml(b)}</h3>
            <p class="car-card-price">${formatPrice(median(prices))}</p>
            <p class="car-card-sub">${rows.length} listings in sample</p>
          </div></a>`;
      }).join('');
    });
  </script>
</body>
</html>
